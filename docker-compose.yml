services:
  # Debug/test script (stdout only, no ZMQ) — do not run simultaneously with
  # zmq-publisher, both services use port 8012.
  xr-receive:
    build: .
    container_name: xr-receive
    command: ["python", "receive_test.py"]
    ports:
      - "8012:8012"
    environment:
      - HAND_TRACKING=${HAND_TRACKING:-false}
      - HOST_IP=${HOST_IP:-}
      - IMG_SERVER_IP=${IMG_SERVER_IP:-}
      - WEBRTC_PORT=${WEBRTC_PORT:-60001}
    restart: unless-stopped

  # Production path: same pose/camera capture as xr-receive, plus
  # ZMQ PUB (topic "teledata") for a ROS2 bridge node
  # (see xr_pose_bridge.py in the main repo, TELEOP_INPUT=xr in ros2_teleop).
  zmq-publisher:
    build: .
    container_name: xr-zmq-publisher
    command: ["python", "zmq_publisher.py"]
    ports:
      - "8012:8012"
      - "5555:5555"
      - "5556:5556"   # return channel: haptic commands from the robot
    environment:
      - HAND_TRACKING=${HAND_TRACKING:-false}
      - HOST_IP=${HOST_IP:-}
      - IMG_SERVER_IP=${IMG_SERVER_IP:-}
      - WEBRTC_PORT=${WEBRTC_PORT:-60001}
      - ZMQ_PORT=${ZMQ_PORT:-5555}
      - HAPTIC_PORT=${HAPTIC_PORT:-5556}
      # 1 = Machbarkeitstest: rechter Controller vibriert 1 s von 3 s (siehe haptics.js)
      - HAPTIC_TEST=${HAPTIC_TEST:-}
      # Pose convention. "unitree" = head/waist-relative for a humanoid, "serial" = raw pose
      # for a fixed-base arm such as a UR. Wrong value -> the robot moves, but not in a way
      # that matches the controller.
      - KINEMATICS=${KINEMATICS:-unitree}
    restart: unless-stopped

  # Linux/Ubuntu only: WebRTC camera stream to the Quest. Pi 5 + RealSense variant.
  # Start with: docker compose up teleimager
  # Camera discovery first: docker compose run teleimager teleimager-server --cf
  teleimager:
    build: ./teleimager-service
    container_name: teleimager
    network_mode: host        # WebRTC requires direct UDP
    # Only video0-5 belong to the RealSense (Depth+Metadata, IR+Metadata,
    # Color+Metadata) — verified via /dev/v4l/by-id/. The additional video19+
    # nodes on this Pi 5 (rpi-hevc-dec, pispbe-*) are the SoC's internal
    # camera/video hardware, independent of any connected USB camera — do not map.
    # If node numbering shifts after re-plugging: `ls -la /dev/v4l/by-id/`
    # reliably shows which video nodes currently belong to the RealSense.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    profiles:
      - ubuntu
    restart: unless-stopped

  # For the real G1's PC2 (Jetson Orin NX): head camera is an Intel RealSense
  # D435I (video0-5 are all the same physical sensor's streams, matched by
  # serial_number in cam_config_server.yaml, not by video_id). Wrist cameras
  # (stock UVC) are not connected yet - fill in once available. Run this ON
  # PC2, not on the Host.
  # Start with: docker compose up teleimager-pc2
  # Camera discovery: docker compose run --rm teleimager-pc2 teleimager-server --cf --rs
  teleimager-pc2:
    build: ./teleimager-service-pc2
    container_name: teleimager-pc2
    network_mode: host        # WebRTC requires direct UDP
    devices:
      - /dev/video0:/dev/video0   # head camera (RealSense D435I, all 6 nodes)
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      # - /dev/videoN:/dev/videoN   # left wrist camera (fill in once connected)
      # - /dev/videoN:/dev/videoN   # right wrist camera (fill in once connected)
    profiles:
      - pc2
    restart: unless-stopped
