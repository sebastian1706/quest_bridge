# =====================================================
# Kamera-Konfiguration fuer teleimager-server auf PC2 (G1 Development Computing
# Unit, Jetson Orin NX) -- Stock-UVC-Kameras (Kopf binokular + 2x Wrist), kein
# RealSense.
#
# Werte (video_id/serial_number) per Discovery ermitteln:
#   docker compose run --rm teleimager-pc2 teleimager-server --cf
# Danach hier eintragen und devices: in docker-compose.yml auf die
# tatsaechlichen /dev/videoN der Kameras anpassen (siehe Kommentar dort).
# =====================================================
head_camera:
  enable_zmq: true
  zmq_port: 55555
  enable_webrtc: true
  webrtc_port: 60001
  webrtc_codec: h264

  type: uvc
  image_shape: [480, 1280]
  binocular: true
  fps: 30

  video_id: 0
  serial_number: null
  physical_path: null

left_wrist_camera:
  enable_zmq: true
  zmq_port: 55556
  enable_webrtc: true
  webrtc_port: 60002
  webrtc_codec: h264

  type: uvc
  image_shape: [480, 640]
  binocular: false
  fps: 30

  video_id: 2
  serial_number: null
  physical_path: null

right_wrist_camera:
  enable_zmq: true
  zmq_port: 55557
  enable_webrtc: true
  webrtc_port: 60003
  webrtc_codec: h264

  type: uvc
  image_shape: [480, 640]
  binocular: false
  fps: 30

  video_id: 4
  serial_number: null
  physical_path: null
