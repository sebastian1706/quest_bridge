# =====================================================
# Kamera-Konfiguration fuer teleimager-server auf PC2 (G1 Development Computing
# Unit, Jetson Orin NX) -- Kopfkamera ist eine Intel RealSense D435I (kein
# generisches UVC-Modul), Wrist-Kameras (falls angeschlossen) sind Stock-UVC.
#
# RealSense-Seriennummer per rs-enumerate-devices ermitteln (nicht die USB-
# iSerial von lsusb/udevadm - das ist die Asic-Serial/Firmware-Update-ID,
# eine andere ID als rs.camera_info.serial_number, gegen die hier gematcht wird).
# UVC-Werte (video_id/serial_number) per Discovery ermitteln:
#   docker compose run --rm teleimager-pc2 teleimager-server --cf --rs
# Danach hier eintragen und devices: in docker-compose.yml auf die
# tatsaechlichen /dev/videoN der Wrist-Kameras anpassen (siehe Kommentar dort).
# =====================================================
head_camera:
  enable_zmq: true
  zmq_port: 55555
  enable_webrtc: true
  webrtc_port: 60001
  webrtc_codec: h264

  # RealSense-SDK (pyrealsense2) statt generischem UVC/OpenCV-Zugriff - liefert
  # den Farbstream zuverlaessig ueber die Seriennummer, unabhaengig davon,
  # welchem /dev/videoN-Knoten der Farbsensor gerade zugeordnet ist (RealSense
  # legt pro Sensor mehrere Knoten an, siehe docker-compose.yml).
  type: realsense
  image_shape: [480, 640]
  binocular: false
  fps: 30

  video_id: null
  serial_number: 348522072474
  physical_path: null

# --- ZED_CAMERA_BLOCK_START --- (marker used by start-teleimager-pc2.sh: when the ZED-M
# isn't physically present it strips this whole block out of a copy of this file and
# bind-mounts that copy over the image's baked-in config instead. teleimager-server's
# ImageServer.start() refuses to start ANY camera - including a perfectly healthy
# head_camera - if even one *configured* camera can't be found at startup, so zed_camera
# can't just be left in place "optionally". Do not reflow/rename these two marker lines.
#
# Stereolabs ZED-M, per USB angeschlossen (vid:pid 2b03:f682). Hat keine per-
# udev auslesbare Seriennummer (ID_SERIAL ist nur Vendor+Modell) - Matching
# daher ueber physical_path statt serial_number. video-index0 (Capture-
# faehig) ist die Bildquelle, video-index1 ist nur ein Kontroll-Interface
# ohne Capture, siehe /dev/v4l/by-id/usb-Technologies__Inc._ZED-M-*.
#
# type: opencv, nicht uvc: die Kamera liefert per USB-Deskriptor ausschliesslich
# YUY2 (nie MJPG), und zwar als EIN Side-by-Side-Stereo-Frame in genau diesen
# festen Groessen (v4l2-ctl -d /dev/videoN --list-formats-ext bzw. pyuvc
# all_modes): 1344x376 @ 15/30/60/100fps, 2560x720 @ 15/30/60fps,
# 3840x1080 @ 15/30fps, 4416x1242 @ 15fps. UVCCamera (type: uvc) verlangt
# zwingend format_name=="MJPG" und pyuvc/libuvc stuft bei diesem Geraet
# zusaetzlich JEDEN deklarierten Modus intern als "unsupported" ein (vermutlich
# eine Bandbreiten-Berechnung, die mit UVC 1.10 hier nicht klarkommt) - so dass
# UVCCamera unabhaengig von image_shape/fps immer mit "No matching uvc mode
# found" scheitert. OpenCVCamera (type: opencv) hat keine dieser beiden
# Einschraenkungen: sie oeffnet per V4L2 und wandelt YUYV->BGR selbst um.
# 1344x376 unten ist die kleinste/guenstigste der vier Groessen - bei Bedarf
# per --cf pruefen und auf eine der anderen umstellen.
zed_camera:
  enable_zmq: true
  zmq_port: 55558
  enable_webrtc: true
  webrtc_port: 60004
  webrtc_codec: h264

  type: opencv
  image_shape: [1242, 4416]
  binocular: true
  fps: 15

  video_id: null
  serial_number: null
  physical_path: /sys/devices/platform/3610000.xhci/usb2/2-2/2-2.2/2-2.2:1.0
# --- ZED_CAMERA_BLOCK_END ---

